<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Gateway</title>
  <style>
    :root {
      /* Modern Color-blind friendly palette (Deuteranopia/Protanopia) */
      --bg: #f8fafc;
      --ink: #0f172a;
      --mute: #64748b;
      --line: #e2e8f0;
      --card: #ffffff;
      --accent: #3b82f6;
      --ok: #0072B2;      /* Blue (Safe for red-green blindness) */
      --ok-bg: #f0f9ff;
      --warn: #E69F00;    /* Orange */
      --bad: #D55E00;     /* Vermillion (Safe for red-green blindness) */
      --off: #94a3b8;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --ink: #f1f5f9;
        --mute: #94a3b8;
        --line: #1e293b;
        --card: #1e293b;
        --accent: #60a5fa;
        --ok: #56B4E9;
        --ok-bg: #0c4a6e;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
      font-weight: 600;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .app {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .5rem .9rem;
      padding: 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app:hover {
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      transform: translateY(-2px);
    }

    .app.running { 
      background: var(--ok-bg); 
      border-color: var(--ok);
      color: var(--ok);
    }

    .dot {
      width: .7rem;
      height: .7rem;
      border-radius: 50%;
      margin-top: .5rem;
      background: var(--off);
    }

    .dot.running {
      background: var(--ok);
    }

    .dot.starting {
      background: var(--warn);
    }

    .dot.crashed {
      background: var(--bad);
    }

    .who span {
      display: block;
      color: var(--mute);
      font-size: .9rem;
    }

    .acts {
      grid-column: 2;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    @media (min-width:48rem) {
      .app {
        grid-template-columns: auto 1fr auto;
        align-items: center;
      }

      .acts {
        grid-column: auto;
      }
    }

    @media (max-width: 48rem) {
      .app {
        grid-template-columns: auto 1fr;
      }
      .acts {
        grid-column: 2;
      }
    }

    @media (max-width: 40rem) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .app {
        grid-template-columns: 1fr;
        gap: .75rem;
        padding: 1rem;
      }
      .acts {
        grid-column: 1;
        justify-content: flex-start;
        width: 100%;
      }
      .acts button, .acts .btn {
        flex: 1;
        min-width: 0;
        font-size: .8rem;
        padding: .4rem .2rem;
      }
      .dot {
        margin-top: 0;
      }
    }

    button,
    .btn {
      font: inherit;
      font-size: .875rem;
      font-weight: 500;
      padding: .5rem .8rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover,
    .btn:hover {
      background: var(--bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      filter: brightness(1.1);
      color: #fff;
    }

    .btn.off {
      opacity: .45;
      pointer-events: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #msg,
    #cfg {
      display: none;
      margin-bottom: 1rem;
      padding: .6rem .9rem;
      border: 1px solid var(--bad);
      border-radius: 4px;
      color: var(--bad);
    }

    .empty {
      padding: 1.5rem 1rem;
      color: var(--mute);
    }

    dialog {
      width: min(60rem, 94vw);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }

    pre {
      max-height: 60vh;
      overflow: auto;
      font: 13px/1.4 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>App Gateway</h1>
      <button onclick="act('/admin/reload')">Reload config</button>
    </header>
    <div id="msg" role="alert"></div>
    <div id="cfg" role="alert"></div>
    <ul id="apps"></ul>
  </main>
  <dialog id="logs">
    <h2 id="logTitle" style="font-size:1.1rem;margin-top:0"></h2>
    <pre id="logBody"></pre>
    <button onclick="document.getElementById('logs').close()">Close</button>
  </dialog>
  <script>
    const LOOPBACK = "{{ 'yes' if local else 'no' }}" === "yes" || ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) || location.hostname.endsWith(".localhost");
    const DOMAIN = LOOPBACK ? "localhost" : "{{ domain }}";   // same machine: no DNS / nip.io; other devices: configured base_domain
    const LABEL = { running: "Running", starting: "Starting", stopped: "Stopped", crashed: "Crashed" };
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function row(a) {
      const live = a.status === "running" || a.status === "starting";
      const sub = `${location.protocol}//${a.id}.${DOMAIN}${location.port ? ":" + location.port : ""}/`;
      const byPort = `http://${location.hostname}:${a.public_port}/`;   // same address the dashboard was opened with
      const off = a.status === "running" ? "" : "off";
      const note = a.removed ? ", removed from apps.yaml" : a.restart_needed ? ", restart to apply config changes" : "";
      return `<li class="app ${a.status === 'running' ? 'running' : ''}">
    <span class="dot ${a.status}" title="${LABEL[a.status]}"></span>
    <div class="who"><strong>${esc(a.name)}</strong><span>${esc(a.id)} on port ${a.display_port}, ${LABEL[a.status].toLowerCase()}${note}</span></div>
    <div class="acts"> 
      ${live ? `<button onclick="act('/admin/apps/${a.id}/stop')">Stop</button>
                <button onclick="act('/admin/apps/${a.id}/restart')">Restart</button>`
          : `<button class="primary" onclick="act('/admin/apps/${a.id}/start')">Start</button>`}
      <a class="btn ${off}" href="${a.mode === "host" ? sub : a.mode === "port" ? byPort : `/apps/${a.id}/`}" target="_blank" rel="noopener">Open</a>
      <button onclick="showLogs('${a.id}')">Logs</button>
    </div></li>`;
    }

    async function load() {
      try {
        const r = await fetch("/admin/apps");
        const err = r.headers.get("X-Config-Error");
        $("cfg").textContent = err ? `apps.yaml not applied: ${err}` : "";
        $("cfg").style.display = err ? "block" : "none";
        const apps = await r.json();
        $("apps").innerHTML = apps.length ? apps.map(row).join("")
          : `<li class="empty">No apps yet. Add one to apps.yaml, then choose Reload config.</li>`;
      } catch (e) { /* gateway restarting; retry on next tick */ }
    }

    async function act(url) {
      $("msg").style.display = "none";
      
      // Audio feedback
      const isStart = url.includes('/start');
      const isStop = url.includes('/stop');
      if (isStart || isStop) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.type = isStart ? 'sine' : 'triangle';
          const now = ctx.currentTime;
          
          if (isStart) {
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          } else {
            osc.frequency.setValueAtTime(330, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
          }
          
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.1, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          
          osc.start();
          osc.stop(now + 0.1);
        } catch (e) { console.warn("Audio blocked by browser policy"); }
      }

      const r = await fetch(url, { method: "POST" });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        $("msg").textContent = d.detail || r.statusText;
        $("msg").style.display = "block";
      }
      load();
    }

    async function showLogs(id) {
      $("logTitle").textContent = `Logs for ${id}`;
      $("logBody").textContent = await (await fetch(`/admin/apps/${id}/logs`)).text() || "No output yet.";
      $("logs").showModal();
    }

    load(); setInterval(load, 3000);
  </script>
</body>

</html>
